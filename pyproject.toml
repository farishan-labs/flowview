[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowview"
version = "0.1.0"
description = "Native Mermaid/flow viewer (Pele + vocus)."
requires-python = ">=3.10"

[project.scripts]
flowview = "flowview.cli:main"

[tool.setuptools.packages.find]
where = ["."]